<svg xmlns="http://www.w3.org/2000/svg" width="992" height="620" viewBox="0 0 992 620">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#edf4ed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5d9a2"/>
      <stop offset="1" stop-color="#7fc97e"/>
    </linearGradient>
  </defs>
  <rect width="992" height="620" fill="url(#surface)"/>
  <circle cx="900" cy="90" r="170" fill="#e2eee1" opacity="0.42"/>
  <circle cx="75" cy="560" r="145" fill="#e3eee2" opacity="0.5"/>
