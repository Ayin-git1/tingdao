<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">听道 3.1.0 安装</title>
  <desc id="desc">将左侧听道应用拖入右侧应用程序文件夹。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f8faf6"/><stop offset="1" stop-color="#e9f1e8"/></linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#paper)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="48" y="64" font-size="27" font-weight="600" fill="#263d30">听道 <tspan font-weight="400" fill="#607c68">· oto</tspan></text>
    <text x="48" y="91" font-size="15" fill="#607469">让声音成稿，默认留在本机。</text>
    <text x="752" y="64" text-anchor="end" font-size="20" fill="#42654d">3.1.0</text>
    <text x="752" y="91" text-anchor="end" font-size="13" fill="#607469">macOS · Apple Silicon</text>
    <text x="400" y="151" text-anchor="middle" font-size="25" font-weight="600" fill="#263d30">拖入应用程序，开始使用</text>
    <path d="M318 245H482m-12-10 12 10-12 10" fill="none" stroke="#79a984" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="344" text-anchor="middle" font-size="13" fill="#607469">安装完成后，从「应用程序」打开听道</text>
    <path d="M48 362H752" stroke="#ceddce"/>
    <text x="48" y="386" font-size="13" fill="#607469">录音 · 文稿 · 图片笔记 · 摘要目录</text>
    <text x="752" y="386" text-anchor="end" font-size="13" fill="#607469">本地优先</text>
  </g>
</svg>
