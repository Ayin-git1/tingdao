[package]
name = "tingdao-shell"
version = "3.1.0"
description = "听道原生窗口壳 (Tauri v2)"
edition = "2021"

[features]
# 仅为本机热测试版编译：启动时优先使用编译时指定的源码目录。
# 正式 DMG 不启用此 feature，继续只使用包内自包含资源。
test-source = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebsiteDataStore", "block2"] }
block2 = "0.6"

[profile.release]
strip = "none"
lto = true
